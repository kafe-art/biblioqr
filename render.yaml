services:
  - type: web
    name: biblioqr
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Render supplies RENDER_EXTERNAL_URL as the fallback origin.
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: biblioqr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: STUDENT_EMAIL_DOMAIN
        value: alumnos.unp.edu.pe
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: BiblioQR · Biblioteca UNP
      - key: POLICY_LOAN_DAYS
        value: "14"
      - key: POLICY_RENEWAL_DAYS
        value: "7"
      - key: POLICY_MAX_RENEWALS
        value: "2"
      - key: POLICY_MAX_LOANS
        value: "3"
      - key: POLICY_HOLD_HOURS
        value: "24"
      - key: POLICY_FINE_PER_DAY
        value: "1.5"
      - key: POLICY_CURRENCY
        value: S/
      - key: POLICY_WARN_DAYS
        value: "3"

databases:
  - name: biblioqr-db
    plan: free
    region: oregon
    databaseName: biblioqr
